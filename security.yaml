# Secure MCP Shell Configuration
# This configuration uses the new secure execution model that prevents command injection
security:
  # Enable security features
  enabled: true
  
  # Use secure execution (disable shell interpretation)
  # This prevents command injection through shell metacharacters
  use_shell_execution: false
  
  # Allowed executables - only these commands can be executed
  # Use absolute paths for maximum security, or command names for PATH lookup
  #
  # WARNING: Never add shell or language interpreters (bash, sh, python, perl,
  # ruby, node, php) or alias-capable tools (git) to this list. The interpreter
  # executes whatever it is handed, so allowing one bypasses secure mode
  # entirely - the metacharacter checks never see the inner command. mcp-shell
  # logs a warning at startup if it detects one here.
  # Note: 'find' is allowed but can itself spawn processes via -exec; restrict it
  # with blocked_patterns if that matters for your threat model.
  allowed_executables:
    - "ls"
    - "pwd"
    - "whoami"
    - "date"
    - "echo"
    - "cat"
    - "grep"
    - "find"
    - "wc"
    - "head"
    - "tail"
    - "sort"
    - "uniq"
  
  # Legacy settings (deprecated but kept for backwards compatibility)
  # These are ignored when use_shell_execution is false
  allowed_commands: []
  blocked_commands: []
  blocked_patterns: []
  
  # Execution limits
  max_execution_time: "30s"
  max_output_size: 1048576  # 1MB
  
  # Security context
  working_directory: "/tmp"
  run_as_user: ""  # Leave empty to run as current user
  
  # Logging
  audit_log: true

  # Expose file and git write tools (write_file, edit_file, mkdir, move,
  # delete, git_add, git_commit, git_switch, git_restore, git_stash). Off by
  # default.
  writes_enabled: false

  # Operator-defined scripts exposed through the run_script tool. The client
  # picks a name; the argv is yours and cannot be altered.
  # scripts:
  #   test: ["go", "test", "./..."]
  #   lint: ["golangci-lint", "run"]
